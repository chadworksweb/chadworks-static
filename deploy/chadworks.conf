# chadworks.co production vhost -- version-controlled source of truth.
#
# This REPLACES the old vercel.json. The site is a Next.js static export
# tar-synced to /srv/chadworks and served by le-nginx; it is NOT on Vercel,
# so vercel.json's "redirects" and "headers" never ran. Both are migrated
# here into the layer that actually serves the site.
#
# Deploy target on the server: /root/proxy/nginx/conf.d/chadworks.conf
# (conf.d/*.conf is included at http{} context, so the map below is valid).
# The security-headers.inc snippet lives alongside this file and must be
# deployed to the same conf.d directory (it is included by path below).
#
# It is named .inc and NOT .conf on purpose. It is a bare add_header snippet
# with no server{} block, so a .conf name makes conf.d/*.conf load it at http{}
# context, where every vhost on the droplet inherits chadworks' CSP. That broke
# WP admin on illuscaden, joedenman and sayadlaw twice: wp.template is Underscore
# _.template, which compiles via new Function(), and the policy has no
# 'unsafe-eval'. Fixed on the server 2026-07-18, silently reverted by this
# repo's own config deploy on 2026-07-24, fixed in the repo 2026-07-26.
# Never rename it back to .conf.
#
# After changing this file on the server: `nginx -t && nginx -s reload`
# (or reload the le-nginx container).

# --- Legacy-URL redirects (migrated from vercel.json "redirects") ---------
# Keyed on $uri (path only, no query string), each regex anchored with /?$ so
# it matches the old path with or without a trailing slash. Anchored keys are
# disjoint, so listing order does not matter. Empty default = no redirect.
#
# NOTE: several destinations are not launched yet (see src/lib/launch.ts
# LAUNCHED set). Those 301s will land on a sealed/404 page until the target
# page launches; the mapping is preserved 1:1 from vercel.json regardless.
map $uri $cw_redirect {
    default "";

    # Web / packages
    "~^/website-design-and-development/?$"                          "/websites/";
    "~^/website-design-and-development/website-design-packages/?$"  "/web-design-packages/";
    "~^/shopify-web-design/?$"                                      "/shopify/";
    "~^/web-hosting-for-small-business/?$"                          "/websites/";
    "~^/pay-monthly-websites/?$"                                    "/web-design-packages/";

    # SEO / visibility
    "~^/search-engine-optimization/?$"                             "/seo/";
    "~^/search-engine-optimization/seo-foundations/?$"             "/seo/";
    "~^/search-engine-optimization/seo-website-audit/?$"           "/ai-visibility-audit/";

    # Music industry
    "~^/music-industry-web-design-consulting/?$"                   "/music-industry-web-design/";

    # About subpages
    "~^/about/rate-and-fees/?$"                                    "/rates/";
    "~^/about/faqs/?$"                                             "/faqs/";

    # Portfolio -> Showroom (renamed 2026-07-15). The showroom is the page now;
    # /portfolio/ is no longer launched, linked, or in the sitemap.
    # The `$` anchor is load-bearing: the captures this site is built on live at
    # /portfolio/<slug>-<device>.jpg and /portfolio/wall/<slug>.jpg. Without it
    # every screenshot on the site would 301 to /showroom/ and the grid would go
    # blank. This matches only the bare page, with or without the trailing slash.
    "~^/portfolio/?$"                                              "/showroom/";

    # Project-page slug hyphenated 2026-07-28 (Chad). The old URL shipped on
    # 2026-07-28, is in the sitemap and in llms.txt, and may already be indexed,
    # so it 301s rather than 404ing. Same `$` anchoring discipline as the rule
    # above: match the page only.
    "~^/showroom/risingcompass/?$"                                 "/showroom/rising-compass/";

    # The package builder BECAME the cost calculator (renamed 2026-07-17). The
    # old slug shipped on prod and its ghost directory has since been pruned, so
    # it 404s today (verified 2026-08-13). The 301 is for the equity: the URL was
    # live and linked, and a 404 throws that away. This map runs before any file
    # serving, so the rule also survives a ghost reappearing on a future deploy.
    "~^/build-your-website-package/?$"                             "/website-design-cost-calculator/";

    # Old article/landing slugs
    "~^/ive-got-wix-squarespace-why-do-i-need-a-web-designer/?$"   "/switch/squarespace-to-static/";
    "~^/read-this-before-you-build-your-own-website/?$"            "/web-design/";
    "~^/exploring-the-key-benefits-of-webmaster-services/?$"       "/websites/";
    "~^/insight-ai-driven-search-algorithms-wont-kill-traditional-seo/?$" "/ai-search-visibility/";

    # /resources/* tree
    "~^/resources/web/wordpress-to-static-with-ai/?$"             "/switch/leave-wordpress/";
    "~^/resources/web/handcoded-form-pipeline/?$"                 "/custom-coded-static/";
    "~^/resources/web/audit-first-style-extraction/?$"           "/web-development/";
    "~^/resources/visibility/geo-aeo-setup-static-site/?$"       "/ai-search-visibility/";
    "~^/resources/process/revision-workflow-with-ai/?$"          "/websites/";
    "~^/resources/process/archive-old-project-cleanly/?$"        "/websites/";
    "~^/resources/voice/humanize-ai-output/?$"                   "/ai-search-visibility/";
    "~^/resources/web/?$"                                        "/websites/";
    "~^/resources/visibility/?$"                                 "/visibility/";
    "~^/resources/process/?$"                                    "/websites/";
    "~^/resources/voice/?$"                                      "/visibility/";

    # Old blog / taxonomy
    "~^/blog/?$"                                                 "/";
    "~^/category/client-resources/?$"                            "/";
    "~^/category/general/?$"                                     "/";

    # Policy
    "~^/cookie-policy/?$"                                        "/privacy-policy/";
}

# --- HTTP: ACME + force HTTPS ---------------------------------------------
server {
    listen 80;
    server_name chadworks.co www.chadworks.co;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Always land on the apex over TLS. Written literally rather than as
    # $server_name so adding a hostname to the line above can never silently
    # change where HTTP traffic lands.
    location / {
        return 301 https://chadworks.co$request_uri;
    }
}

# --- HTTPS: www -> apex (canonical host) ------------------------------------
# www is a redirect-only host, never a second copy of the site. Serving both
# hostnames from one block made Google index every page twice and file the www
# copy under "Alternate page with proper canonical tag" (fixed 2026-07-18).
# The canonical tags in the HTML still point at the apex; this makes the HTTP
# layer agree with them instead of relying on the meta layer alone.
# The chadworks.co cert covers www as a SAN, so this block reuses it.
server {
    listen 443 ssl;
    http2 on;
    server_name www.chadworks.co;

    ssl_certificate /etc/letsencrypt/live/chadworks.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chadworks.co/privkey.pem;

    return 301 https://chadworks.co$request_uri;
}

# --- HTTPS: static site -----------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name chadworks.co;

    # Country block (unchanged): $geo_cc / $cw_deny set by 00-geoblock*.conf.
    access_log /var/log/nginx/geoblock.log geoblock if=$cw_deny;
    if ($cw_deny) { return 403; }

    ssl_certificate /etc/letsencrypt/live/chadworks.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chadworks.co/privkey.pem;

    # Legacy-URL redirects (map above). Runs before any file serving.
    if ($cw_redirect) { return 301 $cw_redirect; }

    # Collapse the export's index.html duplicates onto the clean URL, so
    # /index.html and /about/index.html cannot be crawled as pages separate
    # from / and /about/. Covers every route automatically, including ones
    # launched later. MUST test $request_uri, not $uri: try_files "$uri/" below
    # internally rewrites to .../index.html, and $uri would match that rewrite
    # and 301 the page back onto itself in a loop. $request_uri only ever holds
    # what the client actually asked for. The capture drops any query string.
    if ($request_uri ~ "^([^?]*)/index\.html") {
        return 301 https://chadworks.co$1/;
    }

    # chadworks-static (Next.js static export), tar-synced to /srv/chadworks.
    root /srv/chadworks;
    index index.html;

    client_max_body_size 512M;

    # Security headers (migrated from vercel.json). Re-included in any block
    # below that sets its own add_header (nginx drops inherited headers there).
    include /etc/nginx/conf.d/security-headers.inc;

    # gzip. Scoped to this server block, never http{}, so it cannot reach the
    # other sites on the shared proxy. See deploy/compression.conf.
    include /etc/nginx/conf.d/compression.conf;

    # trailingSlash: true export -- directories carry index.html.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Immutable hashed build assets.
    location /_next/static/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Serve the sitemap XSL stylesheet as XML so browsers apply the
    # transform (nginx mime.types omits .xsl -> octet-stream otherwise).
    location = /sitemap.xsl {
        default_type text/xsl;
    }

    error_page 404 /404.html;
}
