# staging.chadworks.co vhost -- version-controlled source of truth.
#
# The `staging` branch, built and tar-synced to /srv/chadworks-staging and served
# as plain static files by the shared le-nginx proxy. Mirrors chadworks.conf so
# staging behaves like production; the differences are listed below.
#
# Deploy target on the server: /root/proxy/nginx/conf.d/chadworks-staging.conf
# Push with:  bash deploy.sh config
# After changing on the server: nginx -t && nginx -s reload
#
# HOW THIS DIFFERS FROM PRODUCTION (chadworks.conf):
#   1. root -> /srv/chadworks-staging, and a single host (no www on staging).
#   2. X-Robots-Tag "noindex, nofollow" on every response. Staging is a full copy
#      of prod's content on a public host, so without this it is duplicate
#      content competing with chadworks.co. The HEADER is the guard, not
#      robots.txt: the export's robots.txt is built for prod and allows
#      crawling. Do NOT add a Disallow -- a blocked crawler never reads the
#      noindex and the URL can still surface. Crawlable + noindex is the rule
#      here and on demos.chadworks.co.
#   3. It does NOT redefine `map $uri $cw_redirect`. See below.
#
# LOAD-BEARING: the redirect map is NOT repeated here.
# chadworks.conf declares `map $uri $cw_redirect` at http{} context, and
# conf.d/*.conf is all included into that same context. Declaring it a second
# time is a duplicate-map error: `nginx -t` then FAILS FOR THE WHOLE PROXY, so
# no vhost can reload -- not just this one. The map is global once declared, so
# this file simply consumes $cw_redirect. Consequence to know: this vhost
# depends on chadworks.conf being present. If prod's vhost is ever removed,
# remove or rework this one in the same change.
#
# PREREQUISITES (none of which this file can do for you):
#   1. DNS: staging.chadworks.co  A -> 138.197.111.66   (GoDaddy)
#   2. Cert: the chadworks.co cert does NOT cover this subdomain; issue a
#      separate one via the le-certbot container (webroot /var/www/certbot).
#   3. le-nginx must mount the docroot. In /root/proxy/docker-compose.yml:
#        - /srv/chadworks-staging:/srv/chadworks-staging:ro
#      then `docker compose up -d` (recreates ONLY le-nginx; the le-proxy
#      network is external, so there is no network drop). Without the mount the
#      root is empty inside the container and every request 404s.
# Until 1 and 2 exist, do NOT install the HTTPS block below -- nginx will fail
# `nginx -t` on a missing certificate and the reload will be refused.

# --- HTTP: ACME + force HTTPS -----------------------------------------------
server {
    listen 80;
    server_name staging.chadworks.co;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# --- HTTPS: static staging site ---------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name staging.chadworks.co;

    # Country block (shared): $geo_cc / $cw_deny set by 00-geoblock*.conf.
    # Kept identical to prod so staging reproduces prod behaviour.
    access_log /var/log/nginx/geoblock.log geoblock if=$cw_deny;
    if ($cw_deny) { return 403; }

    ssl_certificate /etc/letsencrypt/live/staging.chadworks.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.chadworks.co/privkey.pem;

    # Legacy-URL redirects, reusing prod's map (see LOAD-BEARING note above).
    # Destinations are root-relative, so a 301 here stays on the staging host.
    if ($cw_redirect) { return 301 $cw_redirect; }

    # chadworks-static (Next.js static export), tar-synced to /srv/chadworks-staging.
    root /srv/chadworks-staging;
    index index.html;

    client_max_body_size 512M;

    # Security headers (shared with prod). Re-included in any block below that
    # sets its own add_header (nginx drops inherited headers there).
    include /etc/nginx/conf.d/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # gzip, same snippet prod includes, so staging keeps reproducing prod on the
    # wire as well as in content. See deploy/compression.conf.
    include /etc/nginx/conf.d/compression.conf;

    # trailingSlash: true export -- directories carry index.html.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Immutable hashed build assets.
    location /_next/static/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Serve the sitemap XSL stylesheet as XML so browsers apply the
    # transform (nginx mime.types omits .xsl -> octet-stream otherwise).
    location = /sitemap.xsl {
        default_type text/xsl;
    }

    error_page 404 /404.html;
}
