# Response compression, shared by chadworks.co and staging.chadworks.co.
#
# Deploy target on the server: /root/proxy/nginx/conf.d/compression.conf
# Push with:  bash deploy.sh config
#
# WHY THIS EXISTS. Measured against prod on 2026-07-23: nothing was compressed.
# Not the HTML, not the CSS, not the JS. No Content-Encoding header on any
# response, because le-nginx does not turn gzip on globally and neither vhost
# turned it on for itself. The wire cost of /custom-coded-static/, the page
# whose entire argument is speed:
#
#     0us4a5yne3e6n.js    734 KB uncompressed
#     0iuq-3i8nq2er.css   237 KB uncompressed
#     the HTML document   107 KB uncompressed
#
# Lighthouse 12.8.2 (mobile, simulated slow 4G) scored that page 49 with a
# largest-contentful-paint of 11.2 s, and put the recoverable weight at
# 1,437 KiB. Text compresses roughly 4:1 to 5:1, so this snippet is the single
# largest speed win available to the site, and it is a config line rather than a
# rebuild.
#
# Included INSIDE each server block rather than declared once at http{} on
# purpose: conf.d/*.conf loads into the shared proxy's http{} context, so a
# directive left at the top level here would silently change compression for
# every other site le-nginx serves. Scoped to the two chadworks hosts, this
# file cannot reach them.
#
# text/html is deliberately absent from gzip_types below. nginx always
# compresses text/html when gzip is on, and listing it is a warning-level
# duplicate.

gzip on;

# 6 is the ratio/CPU knee. Levels above it cost measurably more CPU per request
# for low single-digit percentage gains, and this is compress-on-the-fly, not
# pre-compressed files on disk.
gzip_comp_level 6;

# Below roughly a kilobyte the gzip header and the CPU cost outweigh the saving,
# and very small responses can come out larger than they went in.
gzip_min_length 1024;

# Tell caches the body varies by Accept-Encoding, so a proxy cannot hand a
# gzipped body to a client that did not ask for one.
gzip_vary on;
gzip_proxied any;

gzip_types
    text/plain
    text/css
    text/xml
    text/xsl
    application/javascript
    application/json
    application/ld+json
    application/xml
    application/rss+xml
    application/atom+xml
    application/manifest+json
    image/svg+xml;

# NOT compressed, on purpose: webp, jpg, png, woff2 and the rest of the font and
# image formats are already compressed. Running them through gzip burns CPU and
# usually adds a few bytes.
